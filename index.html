<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRRP KOPIS</title>

<style>

:root{
    --color-pcr: #000080; /* PČR - police blue */
    --color-hzs: #c00c0f; /* HZS - fire red */
    --color-zzs: #ffd500e5; /* ZZS - medical green */
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f1115;
    color:white;
    font-family:Segoe UI,Tahoma,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#D70C0F;
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
}

.slozky{
    display:grid;
    grid-template-rows:repeat(3,1fr);
    gap:24px;
    max-width:900px;
    width:100%;
}

.slozka{
    background:#1a1f28;
    border-radius:14px;
    padding:40px 20px;
    text-align:center;
    text-decoration:none;
    color:white;
    box-shadow:0 0 12px rgba(0,0,0,.5);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    border:2px solid transparent;
}

/* apply service colors */
.slozka[data-key="pcr"]{ background: var(--color-pcr); }
.slozka[data-key="hzs"]{ background: var(--color-hzs); }
.slozka[data-key="zzs"]{ background: var(--color-zzs); }

.slozka:hover{
    transform:translateY(-4px);
    background:#242c38;
    border-color:#b30000;
}

.slozka .ikona{
    font-size:48px;
    margin-bottom:16px;
    display:block;
}

.slozka .nazev{
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
}

.slozka .popis{
    font-size:13px;
    color:#8b98ab;
    margin-top:8px;
}

@media(max-width:700px){
    .slozky{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<header>
Integrované Operační Středisko
</header>

<main>

<div class="slozky">

<a class="slozka" href="PČR.html" data-key="pcr">
<span class="ikona">🚓</span>
<span class="nazev">PČR</span>
<span class="popis">Policie České republiky</span>
</a>

<a class="slozka" href="HZS.html" data-key="hzs">
<span class="ikona">🚒</span>
<span class="nazev">HZS</span>
<span class="popis">Hasičský záchranný sbor</span>
</a>

<a class="slozka" href="ZZS.html" data-key="zzs">
<span class="ikona">🚑</span>
<span class="nazev">ZZS</span>
<span class="popis">Zdravotnická záchranná služba</span>
</a>

</div>

</main>

</body>
</html>
